<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Guardias y Cobros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Concepto: libro de registro de despacho. Cabecera fija con pestañas, resumen de cobros arriba,
   calendario mensual para guardias y listas con filas separadas por filetes dentro de una sola tarjeta. */
:root{
  --bg:#F1F5F8; --surface:#FFFFFF; --surface2:#E6EDF2; --line:#D3DDE5;
  --ink:#13222D; --muted:#566B79; --accent:#1D5C73; --on-accent:#FFFFFF;
  --oficio:#1D5C73; --privado:#7B3F6E;
  --ok:#1F7A4D; --warn:#9A5D08; --bad:#B3261E;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A22; --surface:#15252F; --surface2:#1C303C; --line:#2A4150;
    --ink:#E6EEF3; --muted:#94A9B7; --accent:#5BB4D1; --on-accent:#07202B;
    --oficio:#5BB4D1; --privado:#D08BC0;
    --ok:#5CC590; --warn:#E0A44A; --bad:#F0817A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A22; --surface:#15252F; --surface2:#1C303C; --line:#2A4150;
  --ink:#E6EEF3; --muted:#94A9B7; --accent:#5BB4D1; --on-accent:#07202B;
  --oficio:#5BB4D1; --privado:#D08BC0;
  --ok:#5CC590; --warn:#E0A44A; --bad:#F0817A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html.lock{overflow:hidden}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.5 var(--f-body);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,p,dl,dd,ul{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.tagline{font-size:13px;color:var(--muted);margin-bottom:8px;text-wrap:balance}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;line-height:1.1}
.top-tools{display:flex;align-items:center;gap:10px;min-width:0}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)}
.sync.warn i{background:var(--warn)}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px}
.tab{flex:1;min-height:42px;border:1px solid transparent;background:transparent;border-radius:9px;font-weight:500;color:var(--muted);padding:0 8px}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);border-color:var(--line)}
.tab small{font-family:var(--f-mono);font-size:11px;margin-left:4px;opacity:.8}

main{padding-block:12px 96px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-head h2{font-family:var(--f-display);font-size:20px;letter-spacing:-.01em}

/* Botones */
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:0 10px}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.icon{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:18px}
.card-title{font-family:var(--f-display);font-size:17px;padding:16px 18px 4px}
.card-sub{font-size:13px;color:var(--muted);padding:0 18px 12px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.grid.two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.stack{display:grid;gap:16px;align-content:start}

.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero{padding:22px 20px}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(36px,9vw,52px);letter-spacing:-.02em;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.stats{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.stats dt{font-size:12px;color:var(--muted)}
.stats dd{font-family:var(--f-mono);font-size:17px;font-weight:500;margin-top:2px}
.bad{color:var(--bad)} .ok{color:var(--ok)} .warn{color:var(--warn)}

/* Gráfico */
.chart{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;height:190px;padding:0 14px 14px}
.col{display:grid;grid-template-rows:auto 1fr auto;gap:4px;min-width:0}
.col .val{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-align:center;min-height:14px;white-space:nowrap}
.col .well{display:flex;align-items:flex-end}
.col .bar{width:100%;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:3px}
.col .bar.late{background:var(--bad)}
.col .bar.zero{background:var(--line)}
.col .bar.later{background:color-mix(in srgb,var(--accent) 45%,var(--surface))}
.col .lab{font-size:11px;color:var(--muted);text-align:center;text-transform:capitalize;white-space:nowrap}

/* Filas */
.list{display:grid}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:4px 12px;padding:14px 18px;border-top:1px solid var(--line);align-items:start}
.row:first-child{border-top:0}
.datebox{grid-row:span 2;width:48px;height:52px;border-radius:9px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.datebox b{font-family:var(--f-mono);font-size:18px;font-weight:600}
.datebox span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px;color:var(--muted);margin-top:2px}
.row-pay{font-size:13px;color:var(--muted);margin-top:2px}
.row-side{grid-column:3;grid-row:1 / span 2;text-align:right;display:grid;gap:6px;justify-items:end;align-content:start}
.amount{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.row-actions{grid-column:2 / -1;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border:1px solid color-mix(in srgb,currentColor 35%,transparent);border-radius:6px;padding:1px 6px}
.chip.oficio{color:var(--oficio)} .chip.privado{color:var(--privado)}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.pendiente{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.pill.retrasado{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pill.cobrado{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.empty{text-align:center;padding:28px 18px;color:var(--muted)}
.empty h3{font-family:var(--f-display);color:var(--ink);font-size:20px;margin-bottom:6px}
.empty p{max-width:46ch;margin:0 auto 16px}
.empty .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);padding:10px 14px;border:1px dashed var(--line);border-radius:10px;margin-bottom:12px}

/* Calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 8px}
.cal-head h3{font-family:var(--f-display);font-size:18px;text-transform:capitalize;flex:1;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:0 12px 14px}
.dow{font-size:11px;text-align:center;color:var(--muted);font-weight:600;padding:4px 0}
.day{min-height:54px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left}
.day.blank{border-color:transparent;background:transparent;cursor:default}
.day b{font-family:var(--f-mono);font-size:13px;font-weight:500;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:11px}
.day.today b{background:var(--accent);color:var(--on-accent)}
.day.sel{outline:2px solid var(--accent);outline-offset:-1px}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--oficio)}
.dot.privado{background:var(--privado)}
.dot.paid{opacity:.35}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:0 18px 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 18px;flex-wrap:wrap}
.dayhead h3{font-family:var(--f-display);font-size:17px}

/* Filtros */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.seg{display:inline-flex;background:var(--surface2);padding:3px;border-radius:10px;gap:2px}
.seg button{border:1px solid transparent;background:transparent;border-radius:7px;min-height:36px;padding:0 12px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:var(--line)}
.search{flex:1;min-width:180px}

.lockbox{max-width:460px;margin:24px auto}
.authseg{display:flex;margin-bottom:18px}.authseg button{flex:1}
.lock-h{font-family:var(--f-display);font-size:22px;margin-bottom:8px}
.lock-form{display:grid;gap:14px;margin-top:16px}
.lockbox .field input{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
.rk{font-size:19px;letter-spacing:.04em;padding:14px;background:var(--surface2);border-radius:10px;text-align:center;overflow-wrap:anywhere;user-select:all;margin:16px 0 12px;font-weight:500}
.rk-actions{display:flex;gap:8px;margin-bottom:12px}
.vh{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
label.btn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.data-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.dsec{display:grid;gap:6px;justify-items:start}
.restore{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:6px;justify-items:start}
.top-row{flex-wrap:wrap}
.top-tools{flex-wrap:wrap}
.hint.bad{color:var(--bad)}
/* Formularios */
.field{display:grid;gap:6px}
.field label,.lbl{font-size:13px;font-weight:600}
.field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea{
  width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
.field textarea{min-height:84px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.two-col{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:520px){.two-col{grid-template-columns:repeat(2,minmax(0,1fr))}}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* Hoja de edición */
.overlay{position:fixed;inset:0;background:rgba(5,15,22,.55);z-index:40}
.sheet{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:92dvh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet h2{font-family:var(--f-display);font-size:19px}
.sheet .fields{padding:16px 18px;display:grid;gap:14px;overflow:auto}
.sheet footer{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet footer .grp{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--bad);font-size:13px;font-weight:500}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100vw - 32px));max-height:88dvh;border-radius:16px}
  .sheet footer{padding-bottom:12px}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100vw - 32px)}
.bottom-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
@media (prefers-reduced-motion: no-preference){
  .btn,.tab,.day{transition:border-color .12s,background-color .12s}
}
</style>
</head><body>

<div class="wrap">
  <header class="top">
    <p class="tagline">Creado para los abogados que quieran más control sobre sus facturas</p>
    <div class="top-row">
      <h1 class="brand">Guardias y Cobros</h1>
      <div class="top-tools">
        <span class="sync" id="sync"><i></i><span>Conectando</span></span>
        <button class="btn sm" data-action="settings" id="plazosbtn" type="button">Plazos</button>
        <button class="btn sm" data-action="data" id="databtn" type="button">Datos</button>
        <button class="btn sm" data-action="lock" id="lockbtn" type="button" hidden>Bloquear</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
  </header>
  <main id="view"></main>
</div>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- utilidades ---------- */
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var addDays=function(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
var today=function(){return iso(new Date())};
var diff=function(a,b){return Math.round((parse(a)-parse(b))/86400000)};
var fmtDate=function(s,o){return parse(s).toLocaleDateString('es-ES',o||{day:'numeric',month:'short',year:'numeric'})};
var EUR=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'});
var money=function(n){return EUR.format(+n||0)};
var compact=function(v){return v>=1000?(v/1000).toFixed(1).replace('.',',')+' k':String(Math.round(v))};
var plural=function(n,a,b){return n+' '+(n===1?a:b)};
function rel(s){var d=diff(s,today());if(d===0)return 'hoy';if(d===1)return 'mañana';if(d===-1)return 'ayer';return d>0?'en '+d+' días':'hace '+(-d)+' días'}
function parseNum(s){s=String(s||'').trim();if(!s)return 0;var n=s.indexOf(',')>-1?parseFloat(s.replace(/\./g,'').replace(',','.')):parseFloat(s);return isFinite(n)?n:0}
function monthStart(d){return new Date(d.getFullYear(),d.getMonth(),1)}

/* ---------- estado ---------- */
var S={
  tab:'resumen', mode:'conectando', ready:{g:false,c:false},
  guardias:[], casos:[], cfg:{plazoOficio:120,plazoPrivado:30},
  month:monthStart(new Date()), selDay:null,
  fTipo:'todos', fEstado:'todos', q:''
};
var refs=null,unsubs=[],idleT=null;
S.where='cloud';S.key=null;S.locked=true;S.setup=false;S.meta=null;S.recover=false;S.pendingRK=null;

var AREAS=['Penal','Civil','Familia','Laboral','Contencioso','Extranjería','Mercantil','Otro'];
var plazo=function(t){return t==='oficio'?S.cfg.plazoOficio:S.cfg.plazoPrivado};
var items=function(){
  return S.guardias.map(function(g){return Object.assign({},g,{_k:'guardias'})})
    .concat(S.casos.map(function(c){return Object.assign({},c,{_k:'casos'})}));
};
var esperado=function(i){return i.cobroPrevisto||(i.fecha?addDays(i.fecha,plazo(i.tipo)):null)};
var estado=function(i){if(i.cobrado)return 'cobrado';var e=esperado(i);return e&&e<today()?'retrasado':'pendiente'};
var sum=function(a){return a.reduce(function(s,i){return s+(+i.importe||0)},0)};
var tipoLabel=function(t){return t==='oficio'?'Oficio':'Privado'};
var estadoLabel={pendiente:'Pendiente',retrasado:'Retrasado',cobrado:'Cobrado'};
var isLoading=function(){return S.mode==='conectando'||(S.mode==='nube'&&!(S.ready.g&&S.ready.c))};

/* ---------- almacenamiento ---------- */
function toast(msg){
  var r=$('#toast-root');r.innerHTML='<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(toast.t);toast.t=setTimeout(function(){r.innerHTML=''},2600);
}
function toData(o){var d=Object.assign({},o);delete d.id;delete d._k;return d}
async function save(kind,obj){
  try{
    if(refs){
      var ref=obj.id?refs[kind].doc(obj.id):refs[kind].doc();
      await ref.set(await seal(toData(obj)));
    }else{
      var arr=S[kind],o=Object.assign({},obj);
      if(!o.id){o.id='l'+Date.now();arr.push(o)}else{var ix=arr.findIndex(function(x){return x.id===o.id});if(ix>-1)arr[ix]=o}
      render();
    }
    return true;
  }catch(e){toast('No se pudo guardar. Inténtalo de nuevo.');return false}
}
async function removeItem(kind,id){
  try{
    if(refs){await refs[kind].doc(id).delete()}
    else{S[kind]=S[kind].filter(function(x){return x.id!==id});render()}
    return true;
  }catch(e){toast('No se pudo eliminar. Inténtalo de nuevo.');return false}
}
async function saveCfg(cfg){
  try{
    if(refs){await refs.app.update({cfg:await seal(cfg)});S.cfg=cfg;render()}else{S.cfg=cfg;render()}
    return true;
  }catch(e){toast('No se pudo guardar los plazos.');return false}
}
/* ---------- cifrado (AES-GCM, clave derivada de tu contraseña, solo en este dispositivo) ---------- */
var TE=new TextEncoder(),TD=new TextDecoder();
function b64(buf){var a=new Uint8Array(buf),t='';for(var i=0;i<a.length;i++)t+=String.fromCharCode(a[i]);return btoa(t)}
function unb64(x){var t=atob(x),a=new Uint8Array(t.length);for(var i=0;i<t.length;i++)a[i]=t.charCodeAt(i);return a}
async function deriveKey(pass,salt,ext){
  var km=await crypto.subtle.importKey('raw',TE.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:310000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},!!ext,['encrypt','decrypt']);
}
function b32(bytes){
  var A='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567',bits=0,val=0,out='';
  for(var i=0;i<bytes.length;i++){val=(val<<8)|bytes[i];bits+=8;while(bits>=5){out+=A[(val>>>(bits-5))&31];bits-=5}val&=(1<<bits)-1}
  if(bits>0)out+=A[(val<<(5-bits))&31];
  return out;
}
async function wrapRaw(kek,raw){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},kek,raw);
  return {iv:b64(iv),d:b64(ct)};
}
async function unwrapRaw(kek,box){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(box.iv)},kek,unb64(box.d)))}
function importDK(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt'])}
function normIdent(x){x=String(x||'').trim();return x.indexOf('@')>-1?x.toLowerCase():x.replace(/\D/g,'')}
function validIdent(x){x=String(x||'').trim();return x.indexOf('@')>-1?/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(x):x.replace(/\D/g,'').length>=9}
function secretOf(id,pw){return normIdent(id)+'\u0001'+pw}
function normRK(x){return String(x||'').toUpperCase().replace(/[^A-Z2-7]/g,'')}
async function makeRecovery(raw){
  var rk=b32(crypto.getRandomValues(new Uint8Array(20))).match(/.{4}/g).join('-');
  var salt2=crypto.getRandomValues(new Uint8Array(16));
  var kek=await deriveKey(normRK(rk),salt2);
  return {rk:rk,salt2:b64(salt2),wrapRec:await wrapRaw(kek,raw)};
}
async function seal(obj){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},S.key,TE.encode(JSON.stringify(obj)));
  return {v:1,iv:b64(iv),d:b64(ct)};
}
async function openBox(box){
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(box.iv)},S.key,unb64(box.d));
  return JSON.parse(TD.decode(pt));
}
async function decodeDocs(snap){
  var out=[];
  for(var i=0;i<snap.docs.length;i++){
    var x=snap.docs[i];
    try{out.push(Object.assign({id:x.id},await openBox(x.data())))}catch(e){}
  }
  return out;
}

/* Almacén en este navegador, para quien no tiene sesión de Claude. Solo guarda datos ya cifrados. */
function localStore(){
  var KEY='gyc_v1',data={meta:null,guardias:{},casos:{}},subs={guardias:[],casos:[]};
  try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);data={meta:d.meta||null,guardias:d.guardias||{},casos:d.casos||{}}}}catch(e){}
  var persist=function(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){throw new Error('storage')}};
  var snapOf=function(kind){return {docs:Object.keys(data[kind]).map(function(id){return {id:id,data:function(){return data[kind][id]}}})}};
  var notify=function(kind){subs[kind].forEach(function(f){f(snapOf(kind))})};
  function coll(kind){return {
    doc:function(id){
      id=id||('l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
      return {id:id,
        set:async function(d){data[kind][id]=d;persist();notify(kind)},
        delete:async function(){delete data[kind][id];persist();notify(kind)}};
    },
    onSnapshot:function(next){subs[kind].push(next);setTimeout(function(){next(snapOf(kind))},0);return function(){subs[kind]=subs[kind].filter(function(f){return f!==next})}}
  }}
  return {
    app:{
      get:async function(){return {exists:!!data.meta,data:function(){return data.meta}}},
      set:async function(m){data.meta=m;persist()},
      update:async function(u){data.meta=Object.assign({},data.meta,u);persist()}
    },
    guardias:coll('guardias'),casos:coll('casos')
  };
}

async function connect(){
  var cl=window.claude;
  if(!window.crypto||!crypto.subtle){S.mode='local';render();return}
  try{
    var db=null,uid=null;
    if(cl&&cl.use){
      try{
        var res=await Promise.all([cl.use('db'),cl.use('user')]);
        db=res[0];uid=res[1]?await res[1].id():null;
      }catch(e){db=null;uid=null}
    }
    if(db&&uid){
      var app=db.doc('data/users/'+uid+'/app');
      refs={app:app,guardias:app.collection('guardias'),casos:app.collection('casos')};
      S.where='cloud';
    }else{
      refs=localStore();S.where='browser';
    }
    var snap=await refs.app.get();
    S.meta=snap.exists?snap.data():{};
    S.setup=!S.meta.salt;
    S.mode='nube';S.locked=true;
    render();
  }catch(e){S.mode='local';refs=null;render()}
}
async function unlock(ident,pass,pass2){
  var err=$('#lock-err');err.textContent='';
  if(!validIdent(ident)){err.textContent='Indica un correo válido o un teléfono de al menos 9 cifras.';return}
  var sec=secretOf(ident,pass),BAD='El correo o teléfono, o la contraseña, no son correctos.';
  try{
    if(S.setup){
      if(pass.length<8){err.textContent='Usa al menos 8 caracteres en la contraseña.';return}
      if(pass!==pass2){err.textContent='Las dos contraseñas no coinciden.';return}
      var raw=crypto.getRandomValues(new Uint8Array(32));
      S.key=await importDK(raw);
      var salt=crypto.getRandomValues(new Uint8Array(16));
      var kek=await deriveKey(sec,salt);
      var rec=await makeRecovery(raw);
      S.meta={v:2,idv:1,salt:b64(salt),wrapPw:await wrapRaw(kek,raw),salt2:rec.salt2,wrapRec:rec.wrapRec,check:await seal({ok:1}),cfg:await seal(S.cfg)};
      await refs.app.set(S.meta);
      S.setup=false;S.pendingRK=rec.rk;
    }else if(S.meta.wrapPw&&S.meta.idv){
      var kek2=await deriveKey(sec,unb64(S.meta.salt)),raw2;
      try{raw2=await unwrapRaw(kek2,S.meta.wrapPw)}catch(e){err.textContent=BAD;return}
      S.key=await importDK(raw2);
      try{await openBox(S.meta.check)}catch(e){S.key=null;err.textContent='No se pudo verificar tus datos.';return}
    }else if(S.meta.wrapPw){
      var kekOld=await deriveKey(pass,unb64(S.meta.salt)),raw4;
      try{raw4=await unwrapRaw(kekOld,S.meta.wrapPw)}catch(e){err.textContent='La contraseña no es correcta.';return}
      S.key=await importDK(raw4);
      try{await openBox(S.meta.check)}catch(e){S.key=null;err.textContent='No se pudo verificar tus datos.';return}
      var kekNew=await deriveKey(sec,unb64(S.meta.salt));
      var up4={idv:1,wrapPw:await wrapRaw(kekNew,raw4)};
      await refs.app.update(up4);Object.assign(S.meta,up4);
    }else{
      var k=await deriveKey(pass,unb64(S.meta.salt),true);
      S.key=k;
      try{await openBox(S.meta.check)}catch(e){S.key=null;err.textContent='La contraseña no es correcta.';return}
      var raw3=new Uint8Array(await crypto.subtle.exportKey('raw',k));
      var kek3=await deriveKey(sec,unb64(S.meta.salt));
      var rec3=await makeRecovery(raw3);
      var up={v:2,idv:1,wrapPw:await wrapRaw(kek3,raw3),salt2:rec3.salt2,wrapRec:rec3.wrapRec};
      await refs.app.update(up);Object.assign(S.meta,up);S.pendingRK=rec3.rk;
    }
    await finish();
  }catch(e){S.key=null;err.textContent='No se pudo desbloquear. Inténtalo de nuevo.'}
}
async function recoverPw(rkIn,ident,p1,p2){
  var err=$('#lock-err');err.textContent='';
  var rk=normRK(rkIn);
  if(rk.length!==32){err.textContent='La clave de recuperación tiene 32 letras y números.';return}
  if(!validIdent(ident)){err.textContent='Indica un correo válido o un teléfono de al menos 9 cifras.';return}
  if(p1.length<8){err.textContent='La contraseña nueva necesita al menos 8 caracteres.';return}
  if(p1!==p2){err.textContent='Las dos contraseñas no coinciden.';return}
  try{
    var kek=await deriveKey(rk,unb64(S.meta.salt2)),raw;
    try{raw=await unwrapRaw(kek,S.meta.wrapRec)}catch(e){err.textContent='Clave de recuperación incorrecta.';return}
    S.key=await importDK(raw);
    try{await openBox(S.meta.check)}catch(e){S.key=null;err.textContent='No se pudo verificar tus datos.';return}
    var salt=crypto.getRandomValues(new Uint8Array(16));
    var kekPw=await deriveKey(secretOf(ident,p1),salt);
    var rec=await makeRecovery(raw);
    var up={v:2,idv:1,salt:b64(salt),wrapPw:await wrapRaw(kekPw,raw),salt2:rec.salt2,wrapRec:rec.wrapRec};
    await refs.app.update(up);Object.assign(S.meta,up);
    S.recover=false;S.pendingRK=rec.rk;
    await finish();
  }catch(e){S.key=null;err.textContent='No se pudo completar la recuperación. Inténtalo de nuevo.'}
}
async function finish(){
  if(S.meta&&S.meta.cfg){try{var c=await openBox(S.meta.cfg);if(c&&typeof c.plazoOficio==='number'){S.cfg.plazoOficio=c.plazoOficio;S.cfg.plazoPrivado=c.plazoPrivado}}catch(e){}}
  S.locked=false;S.ready={g:false,c:false};
  var onErr=function(){lock()};
  unsubs.push(refs.guardias.onSnapshot(async function(sn){S.guardias=await decodeDocs(sn);S.ready.g=true;render()},onErr));
  unsubs.push(refs.casos.onSnapshot(async function(sn){S.casos=await decodeDocs(sn);S.ready.c=true;render()},onErr));
  startIdle();render();
}
function lock(){
  unsubs.forEach(function(u){try{u()}catch(e){}});unsubs=[];
  S.key=null;S.locked=true;S.recover=false;S.authTab=null;S.pendingRK=null;S.guardias=[];S.casos=[];S.ready={g:false,c:false};
  clearTimeout(idleT);closeSheet();render();
}
function startIdle(){
  clearTimeout(idleT);
  idleT=setTimeout(function(){if(S.mode==='nube'&&!S.locked&&!S.pendingRK){lock();toast('Bloqueado por inactividad')}},10*60*1000);
}
['click','keydown','touchstart'].forEach(function(n){document.addEventListener(n,function(){if(S.mode==='nube'&&!S.locked)startIdle()},{passive:true})});

function row(i,opts){

  var meta=['<span class="chip '+esc(i.tipo)+'">'+tipoLabel(i.tipo)+'</span>',g?'Guardia':'Caso'];
  if(!g&&i.ref)meta.push('Exp. '+esc(i.ref));
  if(!g&&i.area)meta.push(esc(i.area));
  if(!g&&i.estado==='cerrado')meta.push('Cerrado');
  var pay='';
  if(i.cobrado){pay='Cobrado el '+fmtDate(i.fechaCobro||i.fecha)}
  else if(e){pay='Cobro '+(i.cobroPrevisto?'previsto':'estimado')+' el '+fmtDate(e)+' ('+rel(e)+')'}

/* ---------- vistas ---------- */
function vResumen(){
  var all=items();
  if(!all.length)return modeNote()+emptyAll();
  var T=today(),pend=all.filter(function(i){return !i.cobrado});
  var retr=pend.filter(function(i){return estado(i)==='retrasado'});
  var prox=pend.filter(function(i){var e=esperado(i);return e>=T&&e<=addDays(T,30)});
  var year=T.slice(0,4);
  var cobY=all.filter(function(i){return i.cobrado&&(i.fechaCobro||i.fecha||'').slice(0,4)===year});

  var now=new Date(),buckets=[{l:'Atrasado',v:0,c:'late'}],keys=[];
  for(var k=0;k<6;k++){
    var m=new Date(now.getFullYear(),now.getMonth()+k,1);
    keys.push(m.getFullYear()+'-'+pad(m.getMonth()+1));
    buckets.push({l:m.toLocaleDateString('es-ES',{month:'short'}).replace('.',''),v:0,c:''});
  }
  buckets.push({l:'Después',v:0,c:'later'});
  pend.forEach(function(i){
    var e=esperado(i);if(!e)return;var amt=1;
    if(e<T){buckets[0].v+=amt;return}
    var ix=keys.indexOf(e.slice(0,7));
    if(ix>-1)buckets[ix+1].v+=amt;else buckets[7].v+=amt;
  });
  var max=Math.max.apply(null,buckets.map(function(b){return b.v}).concat([1]));

  var chart=buckets.map(function(b){
    var h=b.v?Math.max(4,b.v/max*100):0;
    return '<div class="col"><span class="val">'+(b.v?compact(b.v):'')+'</span><div class="well"><div class="bar '+(b.v?b.c:'zero')+'" style="height:'+(b.v?h:2)+'%"></div></div><span class="lab">'+esc(b.l)+'</span></div>';
  }).join('');

  var nextPay=pend.filter(function(i){return esperado(i)}).sort(function(a,b){return esperado(a)<esperado(b)?-1:1}).slice(0,6);
  var nextG=S.guardias.filter(function(g){return g.fecha>=T}).sort(function(a,b){return a.fecha<b.fecha?-1:1}).slice(0,4).map(function(g){return Object.assign({},g,{_k:'guardias'})});

  return modeNote()+
  '<div class="grid two">'+
   '<div class="stack">'+
    '<section class="card hero"><p class="eyebrow">Pendiente de cobro</p><p class="big">'+pend.length+'</p>'+
     '<p class="muted">'+(pend.length===1?'partida sin cobrar':'partidas sin cobrar')+'</p>'+
     '<dl class="stats">'+
      '<div><dt>Retrasado</dt><dd class="'+(retr.length?'bad':'')+'">'+retr.length+'</dd></div>'+
      '<div><dt>Próximos 30 días</dt><dd>'+prox.length+'</dd></div>'+
      '<div><dt>Cobrado en '+year+'</dt><dd class="ok">'+money(sum(cobY))+'</dd></div>'+
     '</dl></section>'+
    '<section class="card"><h2 class="card-title">Cobros previstos por mes</h2><p class="card-sub">Partidas pendientes según su fecha de cobro estimada.</p>'+
     '<div class="chart" role="img" aria-label="Partidas pendientes por mes de cobro estimado">'+chart+'</div></section>'+
   '</div>'+
   '<div class="stack">'+
    '<section class="card"><h2 class="card-title">Próximos cobros</h2><p class="card-sub">Lo primero que debería llegar.</p>'+
     (nextPay.length?'<div class="list">'+nextPay.map(function(i){return row(i,{noActions:true})}).join('')+'</div>':'<p class="empty">Todo está cobrado.</p>')+'</section>'+
    '<section class="card"><h2 class="card-title">Próximas guardias</h2><p class="card-sub">Desde hoy en adelante.</p>'+
     (nextG.length?'<div class="list">'+nextG.map(function(i){return row(i,{noActions:true})}).join('')+'</div>':'<p class="empty">No hay guardias futuras registradas.</p>')+'</section>'+
   '</div>'+
  '</div>';
}

async function submitForm(form){
  var kind=form.getAttribute('data-form'),err=$('#form-err');
  var v=function(id){var e=document.getElementById(id);return e?e.value.trim():''};
  if(kind==='settings'){
    var a=parseInt(v('s-oficio'),10),b=parseInt(v('s-privado'),10);
    if(!(a>=0&&a<=730&&b>=0&&b<=730)){err.textContent='Indica días entre 0 y 730.';return}
    if(await saveCfg({plazoOficio:a,plazoPrivado:b})){closeSheet();toast('Plazos guardados')}
    return;
  }
  if(kind==='cobro'){
    var imp=parseNum(v('f-importe'));
    if(!imp){err.textContent='Indica cuánto te han pagado.';return}
    var nc=Object.assign({},editing.base,{cobrado:true,importe:imp,fechaCobro:v('f-fcobro')||today()});
    if(await save(editing.k,nc)){closeSheet();toast('Marcado como cobrado')}
    return;
  }
  var fecha=v('f-fecha');
  if(kind==='guardia'&&!fecha){err.textContent='Indica la fecha de la guardia.';return}
  if(kind==='caso'&&!v('f-titulo')){err.textContent='Indica el cliente o el asunto.';return}
  if(document.getElementById('f-cobrado').checked&&!parseNum(v('f-importe'))){err.textContent='Indica cuánto te han pagado.';return}
  var cobrado=document.getElementById('f-cobrado').checked;
  var o=Object.assign({},editing.base||{},{
    fecha:fecha||null,tipo:v('f-tipo'),importe:parseNum(v('f-importe')),
    cobrado:cobrado,fechaCobro:cobrado?(v('f-fcobro')||today()):null,notas:v('f-notas')
  });
  if(kind==='guardia')o.lugar=v('f-lugar');
  else{o.titulo=v('f-titulo');o.ref=v('f-ref');o.area=v('f-area');o.estado=v('f-estado')}
  if(editing.id)o.id=editing.id;else o.creado=new Date().toISOString();
  if(await save(editing.k,o)){
    if(kind==='guardia'&&o.fecha){S.month=monthStart(parse(o.fecha));S.selDay=o.fecha}
    closeSheet();render();toast('Guardado');
  }
}

/* ---------- exportar ---------- */
function csvCell(x){
  var s=String(x==null?'':x);
  if(/^[=+\-@]/.test(s))s="'"+s;
  return '"'+s.replace(/"/g,'""')+'"';
}
async function saveFile(filename,text,mime){
  var cl=window.claude,dl=null;
  try{dl=cl&&cl.use?await cl.use('downloads'):null}catch(e){dl=null}
  if(dl){
    try{await dl.save({filename:filename,data:text});return true}
    catch(e){if(!e||e.code!=='declined')toast('No se pudo preparar el archivo.');return false}
  }
  try{
    var blob=new Blob([text],{type:mime});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},1500);
    return true;
  }catch(e){toast('No se pudo preparar el archivo.');return false}
}
async function exportCsv(){

function setMsg(t,bad){var m=$('#data-msg');if(m){m.textContent=t;m.className='hint'+(bad?' bad':'')}else toast(t)}
function readText(file){
  return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result||''))};r.onerror=function(){rej(r.error)};r.readAsText(file)});
}
function parseCSV(t){
  t=t.replace(/^﻿/,'');
  var l1=t.split(/\r?\n/)[0]||'',sep=l1.split(';').length>=l1.split(',').length?';':',';
  var rows=[],row=[],cur='',q=false,keep=function(r){return r.some(function(x){return x.trim()!==''})};
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===sep){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';if(keep(row))rows.push(row);row=[]}
    else cur+=c;
  }
  row.push(cur);if(keep(row))rows.push(row);
  return rows;
}
function normDate(x){
  x=String(x||'').trim();var y,m,d,mm=x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(mm){y=+mm[1];m=+mm[2];d=+mm[3]}
  else{mm=x.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);if(!mm)return '';d=+mm[1];m=+mm[2];y=+mm[3]}
  var s2=y+'-'+pad(m)+'-'+pad(d);
  return iso(parse(s2))===s2?s2:'';
}
async function importCsv(text){
  var rows=parseCSV(text);
  if(rows.length<2)return {err:'El archivo no tiene filas para importar.'};
  if(rows.length>2001)return {err:'El archivo tiene demasiadas filas. Divídelo en partes de 2000 como máximo.'};
  var strip=function(h){return String(h||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim()};
  var H=rows[0].map(strip);
  var col=function(names){for(var i=0;i<names.length;i++){var ix=H.indexOf(names[i]);if(ix>-1)return ix}return -1};
  var cReg=col(['registro']),cFecha=col(['fecha']),cTipo=col(['tipo']),cTit=col(['cliente o lugar','cliente','asunto','lugar','titulo']),
      cRef=col(['expediente','n expediente','n. expediente']),cArea=col(['area']),cImp=col(['importe']),cEst=col(['estado']),cFc=col(['fecha de cobro']),cNot=col(['notas']);
  if(cFecha<0)return {err:'No encuentro la columna "Fecha". Usa las mismas columnas que el CSV exportado.'};
  var cell=function(r,c){if(c<0)return '';var v=String(r[c]==null?'':r[c]).trim();if(/^'[=+\-@]/.test(v))v=v.slice(1);return v};
  var n=0,skip=0;
  for(var i=1;i<rows.length;i++){
    var r=rows[i],fecha=normDate(cell(r,cFecha)),reg=strip(cell(r,cReg)),isG=reg.indexOf('guard')===0;
    var tit=cell(r,cTit),tipo=/privad/.test(strip(cell(r,cTipo)))?'privado':'oficio';
    var cobrado=strip(cell(r,cEst))==='cobrado',imp=parseNum(cell(r,cImp));
    var o={fecha:fecha,tipo:tipo,importe:imp,cobrado:cobrado,fechaCobro:cobrado?(normDate(cell(r,cFc))||today()):null,notas:cell(r,cNot),creado:new Date().toISOString()};
    var kind;
    if(isG){if(!fecha){skip++;continue}o.lugar=tit;kind='guardias'}
    else{if(!tit){skip++;continue}o.fecha=fecha||today();o.titulo=tit;o.ref=cell(r,cRef);o.area=cell(r,cArea);o.estado='curso';kind='casos'}
    if(await save(kind,o))n++;else skip++;
  }
  return {n:n,skip:skip};
}
var ID_OK=/^[A-Za-z0-9_.:@+~\-]{1,100}$/;
var boxOk=function(b){return b&&typeof b.iv==='string'&&typeof b.d==='string'&&b.iv.length<100&&b.d.length<400000};
async function importBackup(d){
  var n=0,bad=0;
  var run=async function(kind,list){
    for(var i=0;i<list.length;i++){
      var x=list[i];
      if(!x||!boxOk(x.box)){bad++;continue}
      var o;try{o=await openBox(x.box)}catch(e){bad++;continue}
      var obj=Object.assign({},o);if(ID_OK.test(String(x.id||'')))obj.id=String(x.id);
      if(await save(kind,obj))n++;else bad++;
    }
  };
  await run('guardias',Array.isArray(d.guardias)?d.guardias.slice(0,2000):[]);
  await run('casos',Array.isArray(d.casos)?d.casos.slice(0,2000):[]);
  return {n:n,bad:bad};
}
async function handleImport(file){
  if(file.size>10*1024*1024){setMsg('El archivo es demasiado grande.',true);return}
  setMsg('Importando…',false);
  try{
    var text=await readText(file),res;
    if(/\.json$/i.test(file.name)||/^\s*\{/.test(text)){
      var d;try{d=JSON.parse(text)}catch(e){setMsg('El archivo no se puede leer.',true);return}
      if(!d||d.app!=='guardias-y-cobros'){setMsg('Este archivo no es una copia de esta app.',true);return}
      if(!S.key){setMsg('Inicia sesión para importar una copia.',true);return}
      res=await importBackup(d);
      if(!res.n&&res.bad){setMsg('No se pudo leer ningún registro. La copia pertenece a otro acceso. Para pasarla a un dispositivo nuevo, usa "Restaurar copia cifrada" al registrarte.',true);return}
      setMsg('Importados '+plural(res.n,'registro','registros')+(res.bad?'. No se pudieron leer '+res.bad+'.':'.'),false);
    }else{
      res=await importCsv(text);
      if(res.err){setMsg(res.err,true);return}
      setMsg('Importados '+plural(res.n,'registro','registros')+(res.skip?'. Se omitieron '+res.skip+' filas sin fecha o sin nombre.':'.'),false);
    }
    render();
  }catch(e){setMsg('No se pudo importar el archivo.',true)}
}
async function handleRestore(file){
  var err=$('#lock-err');if(err)err.textContent='';
  var fail=function(m){if(err)err.textContent=m;else toast(m)};
  try{
    if(!S.setup||!refs){fail('Ya hay un acceso creado aquí, no se puede restaurar encima.');return}
    if(file.size>20*1024*1024){fail('El archivo es demasiado grande.');return}
    var d;try{d=JSON.parse(await readText(file))}catch(e){fail('El archivo no se puede leer.');return}
    var m=d&&d.meta;
    if(!d||d.app!=='guardias-y-cobros'||!m||typeof m.salt!=='string'||!m.wrapPw&&!m.check||!boxOk(m.check)){fail('Este archivo no es una copia de esta app.');return}
    await refs.app.set(m);
    var put=async function(kind,list){
      for(var i=0;i<list.length;i++){
        var x=list[i];if(!x||!boxOk(x.box))continue;
        var id=ID_OK.test(String(x.id||''))?String(x.id):null;
        await refs[kind].doc(id||undefined).set({v:1,iv:x.box.iv,d:x.box.d});
      }
    };
    await put('guardias',Array.isArray(d.guardias)?d.guardias.slice(0,2000):[]);
    await put('casos',Array.isArray(d.casos)?d.casos.slice(0,2000):[]);
    S.meta=m;S.setup=false;S.authTab='login';render();
    toast('Copia restaurada. Inicia sesión con tu correo o teléfono y tu contraseña.');
  }catch(e){fail('No se pudo restaurar la copia. Inténtalo de nuevo.')}
}
function openData(){
  if(S.mode==='nube'&&S.locked)return;
  editing=null;
  openSheet('<div class="fields">'+
   '<div class="dsec"><h3 class="lbl">Exportar</h3><p class="hint">El CSV se abre en Excel y no va cifrado, así que guárdalo con cuidado. La copia cifrada solo se abre con tu acceso y sirve de copia de seguridad.</p>'+
   '<div class="data-btns"><button type="button" class="btn" data-action="export">Exportar a CSV</button><button type="button" class="btn" data-action="export-backup">Copia cifrada</button></div></div>'+
   '<div class="dsec"><h3 class="lbl">Importar</h3><p class="hint">Elige un CSV con columnas como Fecha, Tipo, Cliente o lugar, Expediente, Área, Importe, Estado, Fecha de cobro y Notas, o una copia cifrada. Lo que importes se añade a lo que ya tienes. Para una guardia, pon Guardia en la columna Registro.</p>'+
   '<label class="btn" for="import-file">Elegir archivo</label><input type="file" id="import-file" accept=".csv,.json,text/csv,application/json" class="vh"></div>'+
   '<p class="hint" id="data-msg" role="status"></p></div>'+
   '<footer><div class="grp"></div><div class="grp"><button type="button" class="btn" data-action="close-sheet">Cerrar</button></div></footer>',
   'Importar y exportar','data');
}

/* ---------- eventos ---------- */
document.addEventListener('click',async function(ev){
  var el=ev.target.closest('[data-action]');if(!el)return;
  var a=el.getAttribute('data-action'),v=el.getAttribute('data-v');
  switch(a){
    case 'tab':S.tab=v;render();window.scrollTo(0,0);break;
    case 'prev-month':S.month=new Date(S.month.getFullYear(),S.month.getMonth()-1,1);S.selDay=null;render();break;
    case 'next-month':S.month=new Date(S.month.getFullYear(),S.month.getMonth()+1,1);S.selDay=null;render();break;
    case 'today-month':S.month=monthStart(new Date());S.selDay=today();render();break;
    case 'pick-day':S.selDay=el.getAttribute('data-date')===S.selDay?null:el.getAttribute('data-date');render();break;
    case 'new-guardia':openGuardia(null,el.getAttribute('data-date'));break;
    case 'new-caso':S.tab==='casos'||(S.tab='casos',render());openCaso(null);break;
    case 'edit':el.getAttribute('data-k')==='guardias'?openGuardia(el.getAttribute('data-id')):openCaso(el.getAttribute('data-id'));break;
    case 'toggle-cobro':{
      var k=el.getAttribute('data-k'),id=el.getAttribute('data-id');
      var o=S[k].find(function(x){return x.id===id});if(!o)break;
      if(!o.cobrado){openCobro(k,id);break}
      var n=Object.assign({},o,{cobrado:false,fechaCobro:null});
      el.disabled=true;
      if(await save(k,n))toast(n.cobrado?'Marcado como cobrado':'Cobro deshecho');
      break;
    }
    case 'close-sheet':closeSheet();break;
    case 'lock':lock();break;
    case 'auth-tab':S.authTab=v;render();break;
    case 'forgot':S.recover=true;render();break;
    case 'back-lock':S.recover=false;render();break;
    case 'copy-rk':
      try{await navigator.clipboard.writeText(S.pendingRK);toast('Clave copiada')}
      catch(e){var r=document.createRange();r.selectNodeContents($('#rk-text'));var sl=getSelection();sl.removeAllRanges();sl.addRange(r);toast('Selecciónala y cópiala')}
      break;
    case 'rk-done':S.pendingRK=null;render();break;
    case 'settings':openSettings();break;
    case 'export':exportCsv();break;
    case 'export-backup':exportBackup();break;
    case 'data':openData();break;
    case 'f-tipo':S.fTipo=v;render();break;
    case 'f-estado':S.fEstado=v;render();break;
    case 'del-ask':$('#del-ask').hidden=true;$('#del-confirm').hidden=false;break;
    case 'del-cancel':$('#del-confirm').hidden=true;$('#del-ask').hidden=false;break;
    case 'del-do':
      if(editing&&editing.id&&await removeItem(editing.k,editing.id)){closeSheet();render();toast('Eliminado')}
      break;
  }
});
document.addEventListener('submit',function(ev){
  if(ev.target&&ev.target.id==='sheet-form'){ev.preventDefault();submitForm(ev.target)}
  if(ev.target&&ev.target.id==='recover-form'){
    ev.preventDefault();
    recoverPw($('#rk0').value,$('#rkid').value,$('#rk1').value,$('#rk2').value).then(function(){var a=$('#rk1'),b=$('#rk2');if(a)a.value='';if(b)b.value=''});
  }
  if(ev.target&&ev.target.id==='lock-form'){
    ev.preventDefault();
    var p1=$('#lk1'),p2=$('#lk2');
    unlock($('#lk0').value,p1.value,p2?p2.value:'').then(function(){var a=$('#lk1'),b=$('#lk2');if(a)a.value='';if(b)b.value=''});
  }
});
document.addEventListener('input',function(ev){
  if(ev.target&&ev.target.id==='q'){S.q=ev.target.value;$('#lista').innerHTML=casosList()}
});
document.addEventListener('change',function(ev){
  var t=ev.target;if(!t)return;
  if(t.id==='import-file'&&t.files&&t.files[0]){handleImport(t.files[0]);t.value=''}
  if(t.id==='restore-file'&&t.files&&t.files[0]){handleRestore(t.files[0]);t.value=''}
  if(t.id==='rk-ok'){$('#rk-done').disabled=!t.checked}
  if(t.id==='f-cobrado'){
    $('#cobro-box').hidden=!t.checked;
    if(t.checked&&!$('#f-fcobro').value)$('#f-fcobro').value=today();
    if(t.checked)$('#f-importe').focus();
  }
  if(t.id==='f-tipo'&&$('#plazo-txt'))$('#plazo-txt').textContent=plazo(t.value);
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&$('#sheet-form'))closeSheet()});

render();
connect();
})();
</script>
